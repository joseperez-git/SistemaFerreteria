<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ferretería</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="login-body">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
        <div class="login-card">
            <div class="login-header">
                <div class="mb-3">
                    <i class="bi bi-building fs-1 text-primary"></i>
                </div>
                <h2>Ferretería</h2>
                <p>Ingrese sus credenciales para acceder al sistema</p>
            </div>

            <form id="formLogin" class="d-flex flex-column flex-grow-1">
                <!-- Usuario -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" class="form-control" id="username" placeholder="Ingrese su usuario" required autocomplete="off">
                    </div>
                </div>

                <!-- Contraseña con ojito -->
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="clave" placeholder="Ingrese su contraseña" required>
                        <span class="input-group-text password-toggle" id="togglePassword">
                            <i class="bi bi-eye-slash" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>

                <!-- Botón Login con spinner -->
                <button type="submit" class="btn btn-login text-white w-100 mt-2" id="btnLogin">
                    <span id="btnText">Ingresar</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;"></span>
                </button>

                <!-- Mensaje de error/información - Área fija -->
                <div id="errorLogin" class="mt-3" style="min-height: 70px;"></div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS Principal -->
    <script type="module" src="/js/login.js"></script>
</body>

</html>
