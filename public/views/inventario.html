<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-2">Inventario</h2>
        <p>Control de inventario: movimientos de entrada, salida y ajustes de productos.</p>
        <div class="d-flex gap-2">
            <select id="filtroTipoMovimiento" class="form-select" style="width: 140px;">
                <option value="">Todos</option>
                <option value="ENTRADA">Entradas</option>
                <option value="SALIDA">Salidas</option>
                <option value="AJUSTE">Ajustes</option>
            </select>
            <input type="text" id="buscarProductoInv" class="form-control" placeholder="Buscar producto...">
        </div>
    </div>
    <button class="btn btn-dark" disabled>
        <i class="bi bi-plus-circle"></i> Nuevo Movimiento
    </button>
</div>

<div class="card shadow-sm">
    <div class="card-body table-responsive">
        <div class="alert alert-info text-center py-5">
            <i class="bi bi-info-circle-fill fs-1"></i>
            <h5 class="mt-3">Módulo en construcción</h5>
            <p class="mb-0">Próximamente disponible</p>
        </div>
    </div>
</div>
