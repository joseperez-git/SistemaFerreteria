<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ferretería</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- CSS propio -->
    <link rel="stylesheet" href="/assets/css/style.css">

</head>

<body>

    <!-- Botón toggle para móvil -->
    <button class="btn-toggle-sidebar" id="btnToggleSidebar">
        <i class="bi bi-list fs-4"></i>
    </button>

    <div class="d-flex">

        <!-- Sidebar Fijo -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-brand" id="btnDashboard" style="cursor: pointer;">
                <div class="brand-content">
                    <i class="bi bi-building text-white"></i>
                    <h4 class="text-white mb-0">Ferretería</h4>
                </div>
                <small class="text-muted">Sistema de Gestión</small>
            </div>
            <ul class="nav flex-column sidebar-nav" id="menu"></ul>
        </div>

        <!-- Contenido Principal -->
        <div class="content">

            <!-- Navbar -->
            <nav class="navbar-top d-flex justify-content-between align-items-center">
                <div>
                    <span class="fw-semibold text-dark">
                        <i class="bi bi-speedometer2 me-2"></i> Panel Principal
                    </span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span id="usuarioLogueado" class="fw-semibold text-dark"></span>
                    <button class="btn btn-outline-danger btn-sm" id="btnLogout">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </div>
            </nav>

            <!-- Contenido Dinámico -->
            <div class="p-4" id="contenido">
                <!-- El contenido se carga dinámicamente -->
            </div>

        </div>

    </div>

    <!-- Toast para notificaciones -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
        <div id="toastMensaje" class="toast align-items-center text-white border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">Mensaje</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
            <div class="progress" style="height:4px;">
                <div id="toastProgress" class="progress-bar bg-light" style="width:100%;"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS Principal -->
    <script type="module" src="/js/dashboard.js"></script>

</body>

</html>
